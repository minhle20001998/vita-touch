# /etc/keyd/default.conf
#
# Right Alt stands in for the Fn key (the T14 Gen 3's Fn never reaches Linux -
# the embedded controller swallows it, so a real Fn+T cannot be detected).
#
#   hold Right Alt + T  ->  XF86Tools  ->  Cinnamon shortcut -> toggle touchpad
#   tap  Right Alt      ->  nothing (see note below)
#
# Note: keyd rewrites a bare modifier used as a tap target into a layer, so
# rightalt = overload(fnt, rightalt) warns and taps as nothing anyway.
# rightalt = layer(fnt) says the same thing without the warning.

[ids]
*

[main]
rightalt = layer(fnt)

[alt]
c = C-c
v = C-v
x = C-x
z = C-z
a = C-a
w = C-w

[fnt]
# keyd f13 -> KEY_F13 -> X keycode 191 -> XF86Tools.
# Bound in Cinnamon to scripts/toggle-touchpad.sh (Custom Shortcuts).
# f21/f22/f23 would be XF86TouchpadToggle/On/Off, which Cinnamon already binds.
t = f13
